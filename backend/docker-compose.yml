services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: roboflow-cocho-backend:latest
    container_name: roboflow-cocho-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - tmp_storage:/app/tmp_storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tmp_storage:
